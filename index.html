<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Once Upon a Time</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="styles.css?v=67" />
    <link rel="stylesheet" href="rules.css?v=67" />
  </head>
  <body>
    <section id="home" class="home-screen" hidden>
      <div class="hero">
        <div class="lang-switch" role="group" aria-label="Language"></div>
        <p class="hero-kicker" data-i18n="kicker"></p>
        <h1 class="biglogo">Once Upon a Time</h1>
        <p class="authors">Simone Luciani &amp; Matthieu Verdier</p>
        <p class="tagline" data-i18n="tagline"></p>
        <div class="hero-cards" id="heroCards"></div>
      </div>
      <div class="setupcard">
        <div class="modetabs" role="group" aria-label="Game mode">
          <button type="button" data-mode="solo" data-i18n="solo"></button>
          <button type="button" data-mode="online" data-i18n="online"></button>
        </div>
        <div class="hpanel">
          <div class="hrow"><span class="hl2" data-i18n="yourName"></span><label class="namebox"><input id="pname" type="text" maxlength="16" data-i18n-ph="namePh" aria-label="Name" /></label></div>
          <div class="hrow"><span class="hl2" data-i18n="players"></span><div class="dots" id="nseg"></div></div>
          <p class="hint" id="nhint"></p>
          <div class="hrow col"><span class="hl2" data-i18n="level"></span><div class="lvls" id="lvseg"></div></div>
          <div class="hrow col"><span class="hl2" data-i18n="yourWriter"></span><div class="lvls two" id="wseg"></div></div>
        </div>
        <div id="soloBox" class="playbox"><button type="button" id="startBtn" class="bigbtn" data-i18n="start"></button></div>
        <div id="onlineBox" class="playbox" hidden>
          <p class="online-note" data-i18n="onlineNote"></p>
          <button type="button" class="bigbtn" id="createBtn" data-i18n="createRoom"></button>
          <div class="joinrow"><input type="text" id="joinCode" maxlength="11" autocomplete="off" autocapitalize="characters" data-i18n-ph="roomCode" aria-label="Room code" /><button type="button" id="joinBtn" data-i18n="join"></button></div>
          <p class="netmsg" id="netmsg" role="status"></p>
        </div>
        <div class="secbtns">
          <button type="button" id="tutoBtn"><img class="game-icon" src="assets/icons/tag-intelligence.png" alt="" /><span data-i18n="tutorial"></span></button>
          <button type="button" id="statsBtn"><img class="game-icon" src="assets/icons/vp.png" alt="" /><span data-i18n="statistics"></span></button>
          <button type="button" id="rulesBtn"><img class="game-icon" src="assets/icons/effect-type-instant.png" alt="" /><span data-i18n="rules"></span></button>
          <button type="button" id="pnpBtn"><img class="game-icon" src="assets/icons/coin.png" alt="" /><span>Print &amp; Play</span></button>
        </div>
        <div class="decklinks">
          <span class="hl2" data-i18n="theCards"></span>
          <div class="deck-btns" id="deckBtns"></div>
        </div>
      </div>
    </section>

    <section id="lobbyScreen" class="stats-screen" hidden>
      <div class="stats-card lobby-card">
        <p class="hero-kicker" data-i18n="lobbyKicker"></p>
        <h2 class="lobby-title"><span data-i18n="roomWord"></span> <span id="lobbyCode" class="lobby-code"></span></h2>
        <p data-i18n="shareLink"></p>
        <div class="joinrow"><input type="text" id="lobbyLink" readonly aria-label="Link" /><button type="button" id="lobbyCopy" data-i18n="copyLink"></button></div>
        <h3 data-i18n="inRoom"></h3>
        <ul id="lobbyMembers" class="lobby-members"></ul>
        <p class="hint" id="lobbyInfo"></p>
        <p class="hint" data-i18n="botsFill"></p>
        <p class="online-note" id="lobbyWait" data-i18n="waitingHost"></p>
        <div class="lobby-actions"><button type="button" id="lobbyLeave" data-i18n="leave"></button><button type="button" id="lobbyStart" class="bigbtn" data-i18n="startGame"></button></div>
      </div>
    </section>

    <section id="rulesScreen" class="rules-screen" hidden>
      <div class="rules-bar"><button type="button" id="rulesBack" class="primary">← <span data-i18n="home"></span></button><div class="lang-switch small" role="group" aria-label="Language"></div><button type="button" id="rulesPrint" title="Print">🖨</button></div>
      <div id="rulesInApp" class="rules"></div>
    </section>

    <section id="statsScreen" class="stats-screen" hidden>
      <div class="stats-card">
        <div class="stats-head"><h2 data-i18n="statsTitle"></h2><button type="button" id="statsBack" class="primary">← <span data-i18n="home"></span></button></div>
        <div class="filters stats-tabs"><button type="button" data-stats-tab="mine" aria-pressed="true" data-i18n="tabMine"></button><button type="button" data-stats-tab="sims" aria-pressed="false" data-i18n="tabSims"></button></div>
        <div id="myStats">
          <div id="statsBody"></div>
          <div class="stats-foot"><button type="button" id="statsClear" data-i18n="clearStats"></button></div>
        </div>
        <div id="simScreen" hidden>
          <p class="hint" data-i18n="simIntro"></p>
          <div id="simControls"></div>
          <div id="simResults"></div>
        </div>
      </div>
    </section>

    <main class="app" hidden>
      <header class="topbar" hidden>
        <div>
          <h1>Once Upon a Time</h1>
          <p id="phaseText">Set up the game and choose an Action card.</p>
        </div>
        <div class="topbar-right"><div class="lang-switch small" role="group" aria-label="Language"></div><div class="stats" id="stats"></div></div>
      </header>

      <nav class="top-nav"><button id="newGameBtn" type="button">← <span data-i18n="home"></span></button></nav>

      <div id="guide" class="guide" hidden></div>

      <section class="layout">
        <section class="panel offer-row">
          <h2 data-i18n="chooseGroupTitle"></h2>
          <div id="groups" class="groups"></div>
        </section>

        <aside class="panel left-panel">
          <h2 data-i18n="playAction"></h2>
          <div id="actionHand" class="action-hand"></div>
          <h2 data-i18n="writer"></h2>
          <div id="writerPanel"></div>
        </aside>

        <section class="board">
          <div class="tableau-head">
            <h2 data-i18n="tableau"></h2>
            <div class="controls">
              <button id="resolveActionBtn" class="hidden" type="button" disabled data-i18n="resolveAction"></button>
              <button id="endRoundBtn" type="button" disabled data-i18n="endTurn"></button>
            </div>
          </div>
          <div id="tableauSummary" class="summary-grid" aria-label="Icon and card summary"></div>
          <div id="tableau" class="tableau"></div>

          <div class="round-strip">
            <div>
              <span class="label" data-i18n="you"></span>
              <strong id="playerAction">-</strong>
            </div>
            <div>
              <span class="label" data-i18n="nowPlaying"></span>
              <strong id="botAction">-</strong>
            </div>
            <div>
              <span class="label" data-i18n="status"></span>
              <strong id="roundState">Choose Action</strong>
            </div>
          </div>

          <div id="playersPanel" class="players-panel" aria-label="Players"></div>

          <h2 data-i18n="storySoFar"></h2>
          <div id="log" class="log"></div>
        </section>

        <aside class="right-col">
          <section class="panel market-panel">
            <h2 data-i18n="quests"></h2>
            <div id="questDisplay" class="stack"></div>
          </section>
          <section class="panel market-panel">
            <h2><span data-i18n="buyItem"></span> <span class="optional-label" data-i18n="optional"></span></h2>
            <div id="itemDisplay" class="stack"></div>
          </section>
        </aside>
      </section>

      <section id="writerSetup" class="writer-setup hidden" aria-modal="true" role="dialog">
        <div class="writer-setup-content">
          <h2 id="writerSetupTitle">Start game</h2>
          <div id="writerChoices" class="writer-choice-grid"></div>
        </div>
      </section>
    </main>
    <section id="deckCatalog" class="deck-catalog hidden" aria-modal="true" role="dialog" aria-label="Cards">
        <div class="deck-catalog-content">
          <div class="deck-catalog-header">
            <h2 id="deckCatalogTitle">Decks</h2>
            <div class="lang-switch small" role="group" aria-label="Language"></div>
            <button id="closeCatalogBtn" type="button" class="primary">← <span data-i18n="back">Back</span></button>
          </div>
          <nav id="deckCatalogTabs" class="deck-catalog-tabs" aria-label="Choose deck"></nav>
          <div id="deckCatalogCards" class="deck-catalog-cards"></div>
        </div>
      </section>
    <div id="coach" class="coach" hidden role="status"></div>

    <script src="game-data.js?v=67"></script>
    <script src="i18n-cards.js?v=67"></script>
    <script src="i18n.js?v=67"></script>
    <script src="art.js?v=67"></script>
    <script src="cards.js?v=67"></script>
    <script src="app.js?v=67"></script>
    <script src="bot.js?v=67"></script>
    <script src="online.js?v=67"></script>
    <script src="sims.js?v=67"></script>
    <script src="rules.js?v=67"></script>
    <script src="home.js?v=67"></script>
  </body>
</html>
